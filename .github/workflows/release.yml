name: Release Multiplataforma

on:
  push:
    branches:
      - master
      - main
    tags:
      - 'v*'
  # En los pull request se compila pero no se publica: es la forma de probar
  # los tres instaladores antes de mergear. Quedan como artefactos de la
  # corrida, para descargar y abrir.
  pull_request:
    branches:
      - master
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Si esto falla no tiene sentido gastar tres compilaciones, asi que build
  # depende de este job.
  tests:
    name: Tests y análisis estático
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Instalar uv
        uses: astral-sh/setup-uv@v5
        with:
          version: 'latest'

      # Los wheels de PyQt6 traen las librerias de Qt, pero no las librerias del
      # sistema contra las que estas linkean. Sin libEGL.so.1 falla el import de
      # QtWidgets en conftest, o sea antes de que la deteccion de display pueda
      # saltear los tests de la vista 3D. Los tests importan zonda.main, que
      # arrastra QtWebEngine, asi que no alcanza con libEGL.
      #
      # Se piden los paquetes Qt6 de la distro y no una lista de .so a mano para
      # que apt resuelva las dependencias con los nombres que correspondan a la
      # version de Ubuntu del runner: en 24.04 la transicion a time_t de 64 bits
      # renombro varios (libqt6gui6 es libqt6gui6t64, libcups2 es libcups2t64).
      # Estos dos alcanzan porque entre sus dependencias arrastran Gui, Widgets,
      # PrintSupport, Quick y WebEngineCore. Las librerias de Qt asi instaladas
      # quedan sin usar: los wheels resuelven las suyas por RPATH. Lo que hace
      # falta son las del sistema que vienen de arrastre.
      - name: Instalar librerias de sistema que necesita Qt
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libqt6webenginewidgets6 \
            libqt6quickwidgets6

      - name: Instalar dependencias del proyecto
        run: |
          cd python
          uv sync

      - name: Linter
        run: |
          cd python
          uv run ruff check .

      - name: Formato
        run: |
          cd python
          uv run ruff format --check .

      # Sin display, conftest.py fuerza QT_QPA_PLATFORM=offscreen y los tests
      # que necesitan la vista 3D se saltean solos.
      - name: Tests
        run: |
          cd python
          uv run pytest

      # No bloquea: hoy arrastra 149 errores de tipado preexistentes. Queda
      # visible para poder ir bajándolos, pero no puede frenar una release.
      - name: Tipos
        continue-on-error: true
        run: |
          cd python
          uv run mypy zonda

  # La release se publica con el tag que sale de __version__. Si esa version ya
  # se publico, mergear pisaria la release anterior sin avisar.
  verificar-version:
    name: Verificar que la versión no esté publicada
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Comprobar contra las releases publicadas
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(python empaquetado/version.py)
          if gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::La version $VERSION ya esta publicada. Subi __version__ en python/zonda/__acercade__.py"
            exit 1
          fi
          echo "La version $VERSION todavia no esta publicada."

  build:
    name: Compilar en ${{ matrix.os }}
    needs: tests
    runs-on: ${{ matrix.os }}
    # Los scripts de empaquetado imprimen un ✓ al terminar cada paso, y en el
    # runner de Windows el stdout de Python queda en cp1252, que no lo puede
    # representar. El UnicodeEncodeError hacia salir a launcher/build.py con
    # codigo 1 despues de haber compilado el lanzador bien, y el error subia por
    # build_bundle.py hasta make_msi.py: un mensaje decorativo tiraba abajo el
    # MSI. El modo UTF-8 se hereda por toda la cadena de subprocesos con una
    # sola variable. No cambia los archivos que generan: su I/O de texto declara
    # encoding y el resto es binario.
    env:
      PYTHONUTF8: '1'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
            artifact_pattern: dist/*.msi
          - os: macos-latest
            platform: macos
            artifact_pattern: dist/*.dmg
          - os: ubuntu-latest
            platform: linux
            artifact_pattern: dist/*.flatpak

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Instalar uv
        uses: astral-sh/setup-uv@v5
        with:
          version: 'latest'

      - name: Instalar dependencias del proyecto
        run: |
          cd python
          uv sync

      # Pasos específicos para Windows
      # El lanzador nativo se compila con cl.exe, que no está en el PATH del
      # runner por defecto. Sin este paso el build cae en el gcc que trae por
      # casualidad Strawberry Perl.
      - name: Configurar MSVC (Windows)
        if: matrix.platform == 'windows'
        uses: ilammy/msvc-dev-cmd@v1

      # Se fija la versión mayor de WiX porque el id de la EULA es específico de
      # cada una: para la v7 es "wix7". Con la versión flotante, una v8 futura
      # rompería el paso de aceptación.
      - name: Configurar WiX Toolset (Windows)
        if: matrix.platform == 'windows'
        run: |
          dotnet tool install --global wix --version 7.0.0
          wix eula accept wix7

      - name: Compilar instalador Windows (.msi)
        if: matrix.platform == 'windows'
        run: |
          python empaquetado/windows/make_msi.py

      # Pasos específicos para macOS
      - name: Compilar instalador macOS (.dmg)
        if: matrix.platform == 'macos'
        run: |
          python3 empaquetado/macos/make_dmg.py

      # Pasos específicos para Linux
      # La branch del runtime se lee del manifiesto para no tener el número
      # repetido en dos lugares que se puedan desincronizar.
      - name: Instalar Flatpak y el runtime de KDE (Linux)
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder
          BRANCH=$(grep -oP "^runtime-version:\s*'\K[^']+" \
            empaquetado/linux/io.github.efdiloreto.ZondaPro.yml)
          echo "Runtime de KDE: $BRANCH"
          flatpak remote-add --user --if-not-exists flathub \
            https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y flathub \
            "org.kde.Platform//$BRANCH" "org.kde.Sdk//$BRANCH"

      - name: Compilar paquete Linux (.flatpak)
        if: matrix.platform == 'linux'
        run: |
          python3 empaquetado/linux/make_flatpak.py

      # Guardar artefactos
      - name: Subir artefacto de compilación
        uses: actions/upload-artifact@v4
        with:
          name: zonda-${{ matrix.platform }}
          path: ${{ matrix.artifact_pattern }}
          if-no-files-found: error

  publish-release:
    name: Crear GitHub Release
    needs: build
    # Un pull request compila para que se pueda probar, pero no publica nada.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Obtener versión actual
        id: get_version
        run: |
          VERSION=$(python empaquetado/version.py)
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "Versión detectada: $VERSION"

      - name: Descargar todos los artefactos
        uses: actions/download-artifact@v4
        with:
          path: dist-release
          merge-multiple: true

      - name: Listar archivos a publicar
        run: |
          ls -la dist-release/

      - name: Publicar Release en GitHub
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.get_version.outputs.VERSION }}
          name: Zonda v${{ steps.get_version.outputs.VERSION }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            dist-release/*.msi
            dist-release/*.dmg
            dist-release/*.flatpak
