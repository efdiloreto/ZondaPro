name: Release Multiplataforma

# Los instaladores se compilan una sola vez por release, en el pull request de
# dev a master, y esa misma compilacion es la que se publica. El ruleset de
# master pide los tres jobs "Compilar en ..." como check obligatorio, asi que
# para cuando el merge ocurre los tres instaladores ya existen y estan verdes.
# Recompilarlos al mergear daria lo mismo: el ruleset tambien exige que el pull
# request este actualizado con master, con lo cual el arbol que queda mergeado
# es el que ya compilo. Por eso el push a master no compila: descarga los
# artefactos de la corrida del pull request y los publica. Ademas de ahorrar
# tres runners, se publica exactamente lo que se probo antes de mergear y no
# una recompilacion que se le parece.
on:
  # Unico camino que publica una release.
  push:
    branches:
      - master
      - main
  # Compila los tres instaladores. Son a la vez el check obligatorio del merge
  # y los artefactos que despues se publican, y quedan en la corrida para
  # descargarlos y abrirlos antes de mergear: que compilen no prueba que
  # arranquen.
  pull_request:
    branches:
      - master
      - main
  # Ensayo a demanda desde cualquier rama: compila y deja los artefactos, pero
  # no publica.
  workflow_dispatch:

# Cada commit que llega al pull request mientras esta abierto dispara los tres
# builds de nuevo, y el resultado del anterior ya no lo mira nadie. El push a
# master queda afuera del cancelado: ahi se publica, y una release a medio
# publicar es peor que una corrida de mas.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Solo el job que publica escribe. El resto lee.
permissions:
  contents: read

jobs:
  # Si esto falla no tiene sentido gastar tres compilaciones, asi que build
  # depende de este job. Los pasos viven en una action compuesta que comparte
  # con el workflow de dev: si se corrigen aca, se corrigen en los dos lados.
  tests:
    name: Tests y análisis estático
    # En el push a master no se repite: corrio en el pull request, sobre el
    # mismo arbol, y es check obligatorio del merge.
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v5

      - name: Correr verificaciones
        uses: ./.github/actions/verificaciones

  # master se integra unicamente desde dev, que es donde se acumula y se prueba
  # todo antes de una release. Ni los rulesets ni la proteccion de ramas de
  # GitHub saben restringir la rama de origen de un pull request, asi que el
  # control es este job, marcado como check obligatorio en el ruleset.
  origen:
    name: Origen del pull request
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Comprobar que el pull request venga de dev
        # La rama llega por variable de entorno y no interpolada en el script:
        # un nombre de rama es texto que elige quien abre el pull request.
        env:
          RAMA_ORIGEN: ${{ github.head_ref }}
        run: |
          if [ "$RAMA_ORIGEN" != "dev" ]; then
            echo "::error::master solo acepta pull requests desde dev, y este viene de '$RAMA_ORIGEN'. Mergeá primero a dev y abrí el pull request desde ahí."
            exit 1
          fi
          echo "El pull request viene de dev."

  # La release se publica con el tag que sale de __version__. Si esa version ya
  # se publico, mergear pisaria la release anterior sin avisar.
  verificar-version:
    name: Verificar que la versión no esté publicada
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v5

      - name: Configurar Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Comprobar contra las releases publicadas
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(python empaquetado/version.py)
          if gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::La version $VERSION ya esta publicada. Subi __version__ en python/zonda/__acercade__.py"
            exit 1
          fi
          echo "La version $VERSION todavia no esta publicada."

  build:
    name: Compilar en ${{ matrix.os }}
    needs: tests
    # Unica compilacion de la release. En el push a master no corre: los
    # instaladores salieron del pull request y publish-release los descarga.
    if: github.event_name != 'push'
    runs-on: ${{ matrix.os }}
    # Los scripts de empaquetado imprimen un ✓ al terminar cada paso, y en el
    # runner de Windows el stdout de Python queda en cp1252, que no lo puede
    # representar. El UnicodeEncodeError hacia salir a launcher/build.py con
    # codigo 1 despues de haber compilado el lanzador bien, y el error subia por
    # build_bundle.py hasta make_msi.py: un mensaje decorativo tiraba abajo el
    # MSI. El modo UTF-8 se hereda por toda la cadena de subprocesos con una
    # sola variable. No cambia los archivos que generan: su I/O de texto declara
    # encoding y el resto es binario.
    env:
      PYTHONUTF8: '1'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
            artifact_pattern: dist/*.msi
          - os: macos-latest
            platform: macos
            artifact_pattern: dist/*.dmg
          - os: ubuntu-latest
            platform: linux
            artifact_pattern: dist/*.flatpak

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v5

      - name: Configurar Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Instalar uv
        uses: astral-sh/setup-uv@v7
        with:
          version: 'latest'

      - name: Instalar dependencias del proyecto
        run: |
          cd python
          uv sync

      # Pasos específicos para Windows
      # El lanzador nativo se compila con cl.exe, que no está en el PATH del
      # runner por defecto. Sin este paso el build cae en el gcc que trae por
      # casualidad Strawberry Perl.
      - name: Configurar MSVC (Windows)
        if: matrix.platform == 'windows'
        uses: ilammy/msvc-dev-cmd@v1

      # Se fija la versión mayor de WiX porque el id de la EULA es específico de
      # cada una: para la v7 es "wix7". Con la versión flotante, una v8 futura
      # rompería el paso de aceptación.
      - name: Configurar WiX Toolset (Windows)
        if: matrix.platform == 'windows'
        run: |
          dotnet tool install --global wix --version 7.0.0
          wix eula accept wix7

      - name: Compilar instalador Windows (.msi)
        if: matrix.platform == 'windows'
        run: |
          python empaquetado/windows/make_msi.py

      # Pasos específicos para macOS
      - name: Compilar instalador macOS (.dmg)
        if: matrix.platform == 'macos'
        run: |
          python3 empaquetado/macos/make_dmg.py

      # Pasos específicos para Linux
      # La branch del runtime se lee del manifiesto para no tener el número
      # repetido en dos lugares que se puedan desincronizar.
      - name: Instalar Flatpak y el runtime de KDE (Linux)
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder
          BRANCH=$(grep -oP "^runtime-version:\s*'\K[^']+" \
            empaquetado/linux/io.github.efdiloreto.ZondaPro.yml)
          echo "Runtime de KDE: $BRANCH"
          flatpak remote-add --user --if-not-exists flathub \
            https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y flathub \
            "org.kde.Platform//$BRANCH" "org.kde.Sdk//$BRANCH"

      - name: Compilar paquete Linux (.flatpak)
        if: matrix.platform == 'linux'
        run: |
          python3 empaquetado/linux/make_flatpak.py

      # Guardar artefactos
      - name: Subir artefacto de compilación
        uses: actions/upload-artifact@v6
        with:
          name: zonda-${{ matrix.platform }}
          path: ${{ matrix.artifact_pattern }}
          if-no-files-found: error

  publish-release:
    name: Crear GitHub Release
    # No compila: promueve a release los instaladores que ya genero y aprobo el
    # pull request. No lleva needs porque los jobs que compilan no corren en
    # este evento.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    # Los consume el back-merge, que corre despues de publicar.
    outputs:
      version: ${{ steps.get_version.outputs.VERSION }}
      head_sha: ${{ steps.corrida.outputs.HEAD_SHA }}
    permissions:
      contents: write
      # Bajar artefactos de otra corrida necesita leer la API de Actions.
      actions: read
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v5

      - name: Configurar Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Obtener versión actual
        id: get_version
        run: |
          VERSION=$(python empaquetado/version.py)
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "Versión detectada: $VERSION"

      # El commit que acaba de llegar a master es el merge del pull request, y
      # de ahi sale el sha de su head: el commit que compilo los instaladores.
      # Con ese sha se ubica la corrida que los dejo como artefactos.
      - name: Ubicar la corrida que compiló los instaladores
        id: corrida
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        run: |
          HEAD_SHA=$(gh api "repos/$GITHUB_REPOSITORY/commits/$SHA/pulls" \
            --jq '.[0].head.sha // empty')
          if [ -z "$HEAD_SHA" ]; then
            echo "::error::No se encontro el pull request que trajo $SHA a master. Los instaladores salen de su corrida, asi que sin pull request no hay nada que publicar."
            exit 1
          fi
          echo "Head del pull request: $HEAD_SHA"
          echo "HEAD_SHA=$HEAD_SHA" >> $GITHUB_OUTPUT

          RUN_ID=$(gh run list --repo "$GITHUB_REPOSITORY" \
            --workflow release.yml --commit "$HEAD_SHA" \
            --status success --limit 1 \
            --json databaseId --jq '.[0].databaseId // empty')
          if [ -z "$RUN_ID" ]; then
            echo "::error::No hay una corrida exitosa de release.yml para $HEAD_SHA. Volve a correr el workflow en el pull request y despues reintenta este job."
            exit 1
          fi
          echo "Corrida con los instaladores: $RUN_ID"
          echo "RUN_ID=$RUN_ID" >> $GITHUB_OUTPUT

      - name: Descargar los instaladores del pull request
        uses: actions/download-artifact@v7
        with:
          run-id: ${{ steps.corrida.outputs.RUN_ID }}
          github-token: ${{ github.token }}
          path: dist-release
          merge-multiple: true

      # Si un artefacto expiro o quedo sin subir, mejor frenar que publicar una
      # release a la que le falta una plataforma.
      - name: Comprobar que estén los tres instaladores
        run: |
          ls -la dist-release/
          for extension in msi dmg flatpak; do
            if [ -z "$(find dist-release -maxdepth 1 -name "*.$extension" -print -quit)" ]; then
              echo "::error::Falta el instalador .$extension entre los artefactos de la corrida."
              exit 1
            fi
          done

      - name: Publicar Release en GitHub
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.get_version.outputs.VERSION }}
          name: Zonda v${{ steps.get_version.outputs.VERSION }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            dist-release/*.msi
            dist-release/*.dmg
            dist-release/*.flatpak

  # El pull request de dev a master se mergea con squash, asi que master queda
  # con un commit que tiene todo el contenido y ninguno de los commits de dev en
  # su historia. Si dev no lo incorpora, el pull request siguiente vuelve a
  # proponer todo lo que master ya tiene aplastado: git lo ve como historia
  # divergente sobre los mismos archivos y conflictua sin que nadie haya tocado
  # nada. Paso a mano seria uno por release, y de los que se olvidan, porque no
  # duele al publicar sino al abrir el pull request siguiente.
  back-merge:
    name: Traer master de vuelta a dev
    needs: publish-release
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Clonar dev con toda la historia
        uses: actions/checkout@v5
        with:
          ref: dev
          # El merge tiene que ver las dos historias enteras, no el ultimo commit.
          fetch-depth: 0

      # Se mergea con estrategia ours, que se queda con el arbol de dev sin
      # mirar el de master. Eso es correcto solo mientras master no tenga nada
      # propio, y hoy siempre es asi porque el ruleset lo obliga a recibir todo
      # por pull request desde dev. Si algun dia deja de serlo -un hotfix
      # commiteado derecho sobre master- el merge lo descartaria en silencio,
      # asi que se comprueba antes y se frena.
      - name: Comprobar que master no traiga nada que dev no tenga
        env:
          HEAD_SHA: ${{ needs.publish-release.outputs.head_sha }}
        run: |
          if ! git diff --quiet "$HEAD_SHA" origin/master; then
            echo "::error::master tiene contenido que no esta en $HEAD_SHA, el head del pull request que acaba de publicar. Traelo a dev a mano: un merge con estrategia ours lo descartaria."
            git --no-pager diff --stat "$HEAD_SHA" origin/master
            exit 1
          fi
          echo "master no aporta contenido propio: el back-merge es seguro."

      - name: Traer master a dev
        env:
          VERSION: ${{ needs.publish-release.outputs.version }}
        run: |
          # Si el pull request se mergeo con merge commit en vez de squash, dev
          # ya es descendiente de master y no hay nada que traer.
          if git merge-base --is-ancestor origin/master HEAD; then
            echo "dev ya contiene a master, no hay nada que traer."
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git merge -s ours --no-edit origin/master \
            -m "Traer master de vuelta a dev despues de la release $VERSION" \
            -m "Cierra el ciclo del squash: dev incorpora el commit con que master publico la release, para que el pull request siguiente proponga solo lo nuevo. Se mergea con estrategia ours porque ese contenido ya esta en dev."
          git push origin dev
          echo "master quedo incorporado a dev."
